name: ERP tests
on:
  push:
    branches: ['feature/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp_test
          POSTGRES_PASSWORD: synthetic-ci-password-only
          POSTGRES_DB: erp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U erp_test -d erp_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: synthetic-ci-key-only-at-least-32-characters
      DATABASE_URL: postgresql+psycopg://erp_test:synthetic-ci-password-only@localhost:5432/erp_test
      TEST_DATABASE_URL: postgresql+psycopg://erp_test:synthetic-ci-password-only@localhost:5432/erp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check erp tests migrations
      - run: ruff format --check erp tests migrations
      - run: flask --app erp db upgrade
      - run: flask --app erp db check
      - run: flask --app erp db downgrade base
      - run: flask --app erp db upgrade
      - run: python -m pytest -q --junitxml=test-results.xml
      - run: pip install playwright==1.62.0
      - run: PYTHONPATH=. python tests/ui_smoke.py
        env:
          PLAYWRIGHT_CHROMIUM_CHANNEL: chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-operations-mobile
          path: ui-operations-mobile.png
  android-test:
    name: Android test APK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle -p android-app :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thanabunyapat-erp-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
