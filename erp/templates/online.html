<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#152f42">
<title>Thanabunyapat One · ออนไลน์</title>
<link rel="stylesheet" href="/assets/online/app.css">
<script src="/assets/online/printer.js" defer></script>
<script src="/assets/online/app.js" defer></script>
<script src="/assets/online/recovery.js" defer></script>
<script src="/assets/online/operations.js" defer></script>
</head>
<body>
<div id="root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="printer-dialog" aria-labelledby="printer-title">
  <div class="row space"><h2 id="printer-title">เครื่องพิมพ์ Bluetooth 58 มม.</h2><button type="button" class="btn secondary slim" id="printer-close">ปิด</button></div>
  <p>ตั้งชื่อและเลือกรุ่นก่อนเชื่อมต่อ เครื่องพิมพ์ Bluetooth Classic, USB และ LAN ไม่สามารถส่งงานจากเว็บเบราว์เซอร์โดยตรง จึงจะแสดงว่าต้องใช้ Print Bridge หรือแอปผู้ผลิตอย่างชัดเจน</p>
  <p id="printer-status" role="status"></p>
  <form id="printer-form">
    <div class="field"><label for="printer-name">ชื่อเครื่องพิมพ์</label><input id="printer-name" name="printer_name" maxlength="80" autocomplete="off" placeholder="เช่น เครื่องหน้าร้าน"></div>
    <div class="field"><label for="printer-model">รุ่นของเครื่องพิมพ์</label><select id="printer-model" name="printer_model"></select></div>
    <p id="printer-connection-guide" class="printer-guide" aria-live="polite"></p>
    <label class="printer-toggle" for="printer-auto-print"><input id="printer-auto-print" name="auto_print" type="checkbox" checked> พิมพ์ใบเสร็จและบิล</label>
    <div class="field"><label for="printer-service">Service UUID</label><input id="printer-service" name="service_uuid" required maxlength="36" autocomplete="off" spellcheck="false"></div>
    <div class="field"><label for="printer-write">Write Characteristic UUID</label><input id="printer-write" name="write_uuid" required maxlength="36" autocomplete="off" spellcheck="false"></div>
    <div class="row"><button type="submit" class="btn">เลือกเครื่องพิมพ์</button><button type="button" class="btn secondary" id="printer-test">ทดสอบพิมพ์</button><button type="button" class="btn secondary" id="printer-disconnect">ตัดการเชื่อมต่อ</button></div>
  </form>
</dialog>
<div id="print-root" aria-hidden="true"></div>
</body>
</html>
